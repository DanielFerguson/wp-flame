name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Quality baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - run: composer standards

      - run: composer analyse

      - run: composer test:coverage

  unit:
    name: Unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer validate --strict

      - run: composer audit

      - run: composer lint

      - run: composer test:unit

  integration:
    name: Integration / PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wp: '6.0'
          - php: '8.1'
            wp: '6.7'
          - php: '8.3'
            wp: 'latest'
          - php: '8.4'
            wp: 'latest'
          - php: '8.5'
            wp: 'latest'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - run: WP_TESTS_DIR=/tmp/wordpress-tests-lib ./vendor/bin/phpunit --testsuite integration --exclude-group multisite --fail-on-skipped --do-not-cache-result

  integration-multisite:
    name: Integration / multisite / PHP 8.5 / WP latest
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      - run: WP_TESTS_DIR=/tmp/wordpress-tests-lib WP_MULTISITE=1 ./vendor/bin/phpunit --testsuite integration --fail-on-skipped --do-not-cache-result

  integration-mariadb:
    name: Integration / MariaDB 11.4 / PHP 8.3 / WP latest
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      - run: WP_TESTS_DIR=/tmp/wordpress-tests-lib ./vendor/bin/phpunit --testsuite integration --exclude-group multisite --fail-on-skipped --do-not-cache-result

  compatibility:
    name: Compatibility smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: ramsey/composer-install@v3

      - run: npm ci

      - run: npm audit

      - run: npx playwright install --with-deps chromium

      - run: node --check assets/js/admin.js

      - run: node --check assets/js/admin-bar.js

      - run: node --check assets/js/flame-graph.js

      - run: npm run test:js

      - run: npm run compat:smoke

      - run: npm run test:e2e

      - run: npm run test:performance

      - run: bin/build-previous-package.sh e58bef570e8e6b53925796de693937957765b581 build/previous/wp-flame-1.2.0.zip

      - run: bash bin/build-zip.sh

      - run: bash bin/package-lifecycle-smoke.sh build/previous/wp-flame-1.2.0.zip wp-flame-1.3.0-rc.1.zip

      - if: always()
        run: npm run wp-env:stop

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: bash bin/build-zip.sh

      - run: mkdir -p build/plugin-check && unzip -q wp-flame-*.zip -d build/plugin-check

      # WPCS/PHPCS is enforced independently with the repository's explicit
      # no-growth baseline. Plugin Check therefore owns its non-PHPCS package,
      # metadata, repository, performance, and update checks here.
      - uses: wordpress/plugin-check-action@v1.1.7
        with:
          build-dir: './build/plugin-check/wp-flame'
          exclude-checks: 'plugin_review_phpcs'
          slug: 'wp-flame'

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer lint

      - run: bash bin/build-zip.sh

      - run: unzip -t wp-flame-*.zip

  release:
    name: Immutable tagged release candidate
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - quality
      - unit
      - integration
      - integration-multisite
      - integration-mariadb
      - compatibility
      - plugin-check
      - package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: bin/release-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wp-flame-${{ github.ref_name }}
          path: dist/**
          if-no-files-found: error
